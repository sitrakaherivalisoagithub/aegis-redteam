[project]
name = "aegis-ai-redteam"
version = "0.1.0"
description = "Aegis AI Red Team Security Assessment Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2.0",
    "pydantic-settings",
    "sqlalchemy",
    "langgraph",
    "google-cloud-aiplatform",
    "pytest",
    "httpx",
    "streamlit",
    "langchain-google-genai",
    "langchain-core",
    "deepagents",
    "google-auth"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
